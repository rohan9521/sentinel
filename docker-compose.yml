# docker-compose.yml
services:
  backend:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: bash -lc "cd backend && pip install uv && uv sync && uv run uvicorn sentinel.api:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: bash -lc "cd frontend && npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"

